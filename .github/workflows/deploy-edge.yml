name: Deploy Edge Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "edge-worker/**"
      - ".github/workflows/deploy-edge.yml"
      - "scripts/check-wrangler-kv.sh"
      - "scripts/ensure-cloudflare-resources.sh"
      - "scripts/setup-cloudflare.sh"

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand package-lock.json
        run: |
          chmod +x scripts/expand-lockfile.sh
          ./scripts/expand-lockfile.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edge-worker/package-lock.json

      - name: Install dependencies
        working-directory: edge-worker
        run: npm ci

      - name: Type-check
        working-directory: edge-worker
        run: npx tsc --noEmit

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy — set secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            echo "Token needs Account → Workers Scripts Edit + Workers KV Storage Edit."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Create or resolve AUTOFIX_KV (prod + preview) and discovery queues,
      # then patch edge-worker/wrangler.toml for this job.
      - name: Ensure KV namespaces and queues
        id: ensure
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional pre-seeded ids (skip create when set)
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_KV_PREVIEW_ID: ${{ vars.CLOUDFLARE_KV_PREVIEW_ID }}
          SKIP_NPM: "1"
        run: |
          chmod +x scripts/ensure-cloudflare-resources.sh scripts/check-wrangler-kv.sh
          ./scripts/ensure-cloudflare-resources.sh

      - name: Validate wrangler.toml KV ids
        if: steps.creds.outputs.ready == 'true'
        run: ./scripts/check-wrangler-kv.sh edge-worker/wrangler.toml

      - name: Deploy with Wrangler
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: edge-worker
          packageManager: npm
          wranglerVersion: "3.114.0"
          command: deploy
