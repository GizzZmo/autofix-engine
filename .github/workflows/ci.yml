name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  edge-worker:
    name: Edge Worker (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edge-worker/package.json
      - run: npm install
      - name: Type-check
        run: npx tsc --noEmit

  healer:
    name: Healer (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: healer/go.sum
      - name: Verify modules
        run: |
          test -f go.sum || (echo "go.sum missing from repo" && exit 1)
          go mod download
          go mod verify
      - name: Build
        run: go build -o autofix-healer .
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
