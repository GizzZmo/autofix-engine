name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      edge: ${{ steps.filter.outputs.edge }}
      healer: ${{ steps.filter.outputs.healer }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            edge:
              - 'edge-worker/**'
            healer:
              - 'healer/**'
            shared:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'scripts/**'
              - 'docker-compose.yml'

  edge-worker:
    name: Edge Worker (TypeScript)
    needs: changes
    if: needs.changes.outputs.edge == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-worker
    steps:
      - uses: actions/checkout@v4
      - name: Expand package-lock.json
        working-directory: .
        run: |
          chmod +x scripts/expand-lockfile.sh
          ./scripts/expand-lockfile.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edge-worker/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit

  healer:
    name: Healer (Go)
    needs: changes
    if: needs.changes.outputs.healer == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: healer/go.sum
      - name: Verify modules
        run: |
          test -f go.sum || (echo "go.sum missing from repo" && exit 1)
          go mod download
          go mod verify
      - name: Build
        run: go build -o autofix-healer .
      - name: Vet
        run: go vet ./...
      - name: Test with coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tee coverage.txt
          TOTAL=$(go tool cover -func=coverage.out | awk '/total:/ {print $3}')
          echo "Total coverage: $TOTAL"
          echo "coverage=$TOTAL" >> "$GITHUB_OUTPUT"
        id: cov
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: healer-coverage
          path: |
            healer/coverage.out
            healer/coverage.txt
          if-no-files-found: warn
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: healer/coverage.out
          flags: healer
          name: healer-go
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  ci-gate:
    name: CI gate
    needs: [changes, edge-worker, healer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          edge="${{ needs.changes.outputs.edge }}"
          healer="${{ needs.changes.outputs.healer }}"
          shared="${{ needs.changes.outputs.shared }}"
          edge_result="${{ needs.edge-worker.result }}"
          healer_result="${{ needs.healer.result }}"

          echo "edge=$edge healer=$healer shared=$shared"
          echo "edge_result=$edge_result healer_result=$healer_result"

          fail=0
          if [[ "$edge" == "true" || "$shared" == "true" ]]; then
            if [[ "$edge_result" != "success" ]]; then
              echo "Edge worker job failed or was skipped unexpectedly"
              fail=1
            fi
          fi
          if [[ "$healer" == "true" || "$shared" == "true" ]]; then
            if [[ "$healer_result" != "success" ]]; then
              echo "Healer job failed or was skipped unexpectedly"
              fail=1
            fi
          fi

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "CI gate passed"
