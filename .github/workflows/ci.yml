name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  edge-worker:
    name: Edge Worker (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: edge-worker/package.json
      - run: npm install
      - name: Type-check
        run: npx tsc --noEmit

  healer:
    name: Healer (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build -o autofix-healer .
      - name: Vet
        run: go vet ./...
