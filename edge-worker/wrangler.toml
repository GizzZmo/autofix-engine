name = "autofix-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# KV — create with:
#   npx wrangler kv:namespace create AUTOFIX_KV
#   npx wrangler kv:namespace create AUTOFIX_KV --preview
# Then paste the returned ids below.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "AUTOFIX_KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_ID"

# ---------------------------------------------------------------------------
# Queues — create with:
#   npx wrangler queues create autofix-discovery
# DLQ is optional; create only if you enable dead_letter_queue below:
#   npx wrangler queues create autofix-discovery-dlq
# ---------------------------------------------------------------------------
[[queues.producers]]
binding = "DISCOVERY_QUEUE"
queue = "autofix-discovery"

[[queues.consumers]]
queue = "autofix-discovery"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 3
# Uncomment after creating the DLQ:
# dead_letter_queue = "autofix-discovery-dlq"

[vars]
ENVIRONMENT = "production"
